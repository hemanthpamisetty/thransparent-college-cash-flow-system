# ============================================
# College Cashflow Monitoring System
# Spring Boot Application Properties
# ============================================

# ---- Server ----
server.port=8081

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/college_cashflow?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Hemu@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT Configuration ----
app.jwt.secret=CollegeCashflowMonitoringSystemSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm2026
